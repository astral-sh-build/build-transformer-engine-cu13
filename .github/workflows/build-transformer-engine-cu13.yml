name: TransformerEngine CUDA 13 Core

permissions: {}

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.release_tag || github.sha }}
  cancel-in-progress: true

jobs:
  build-wheel:
    name: Build CUDA 13 core wheel (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            dockerfile: x86
            platform: manylinux_2_28_x86_64
            runner: ubuntu-latest
          - architecture: aarch64
            dockerfile: aarch
            platform: manylinux_2_28_aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Determine TransformerEngine version
        id: transformer-engine-version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TRANSFORMER_ENGINE_VERSION=$(sed -E 's/-r[0-9]+$//' <<<"${INPUTS_RELEASE_TAG}")
          else
            TRANSFORMER_ENGINE_VERSION="v2.16"
          fi
          echo "version=${TRANSFORMER_ENGINE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using TransformerEngine version: ${TRANSFORMER_ENGINE_VERSION}"
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUTS_RELEASE_TAG: ${{ inputs.release_tag }}

      - name: Checkout TransformerEngine
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: NVIDIA/TransformerEngine
          ref: ${{ steps.transformer-engine-version.outputs.version }}
          submodules: recursive
          persist-credentials: false

      - name: Get source commit SHA
        id: source-commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout utils
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: build_scripts
          persist-credentials: false

      - name: Apply TransformerEngine compatibility patches
        run: bash build_scripts/prepare_for_build.sh "${TRANSFORMER_ENGINE_VERSION}"
        env:
          TRANSFORMER_ENGINE_VERSION: ${{ steps.transformer-engine-version.outputs.version }}

      - name: Build upstream CUDA core build image
        run: |
          docker build \
            --build-arg "CUDA_MAJOR=${CUDA_MAJOR}" \
            --build-arg "CUDA_MINOR=${CUDA_MINOR}" \
            --build-arg BUILD_METAPACKAGE=false \
            --build-arg BUILD_COMMON=true \
            --build-arg BUILD_PYTORCH=false \
            --build-arg BUILD_JAX=false \
            --tag "${IMAGE_NAME}" \
            --file "build_tools/wheel_utils/Dockerfile.${DOCKERFILE}" \
            .
        env:
          CUDA_MAJOR: "13"
          CUDA_MINOR: "0"
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE_NAME: astral-transformer-engine-cu13-${{ matrix.architecture }}:${{ github.run_id }}

      - name: Build CUDA core wheel
        run: |
          mkdir -p dist
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}/dist:/wheelhouse" \
            "${IMAGE_NAME}"
        env:
          IMAGE_NAME: astral-transformer-engine-cu13-${{ matrix.architecture }}:${{ github.run_id }}

      - name: Identify CUDA core wheel
        id: wheel
        run: |
          wheel=$(find dist -maxdepth 1 -type f -name "transformer_engine_cu13-*-py3-none-${PLATFORM}.whl" -print -quit)
          if [ -z "${wheel}" ]; then
            echo "No compatible CUDA core wheel was built" >&2
            find dist -maxdepth 2 -type f -print
            exit 1
          fi
          echo "path=${wheel}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${wheel}")" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.9.26"
          enable-cache: false

      - name: Embed SBOM into wheel
        run: |
          uv run --script build_scripts/embed_patches.py "${WHEEL_PATH}" \
            "build_scripts/patches/${TRANSFORMER_ENGINE_VERSION}" \
            --license-expression "Apache-2.0" \
            --license-file "LICENSE:LICENSE" \
            --source-repo "https://github.com/NVIDIA/TransformerEngine" \
            --source-tag "${TRANSFORMER_ENGINE_VERSION}" \
            --source-commit "${SOURCE_COMMIT}" \
            --build-repo "https://github.com/astral-sh-build/build-transformer-engine-cu13" \
            --build-commit "${BUILD_COMMIT}"
        env:
          WHEEL_PATH: ${{ steps.wheel.outputs.path }}
          TRANSFORMER_ENGINE_VERSION: ${{ steps.transformer-engine-version.outputs.version }}
          SOURCE_COMMIT: ${{ steps.source-commit.outputs.sha }}
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Log built wheel
        run: ls -lh "${WHEEL_PATH}"
        env:
          WHEEL_PATH: ${{ steps.wheel.outputs.path }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.wheel.outputs.name }}
          path: ${{ steps.wheel.outputs.path }}
          if-no-files-found: error

  create-release:
    name: Create release
    if: github.event_name == 'workflow_dispatch'
    needs: [build-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          gh release create "${RELEASE_TAG}" ./dist/*.whl
          --target "${GITHUB_SHA}"
          --title "${RELEASE_TAG}"
          --notes ""
          --repo "${GITHUB_REPOSITORY}"
